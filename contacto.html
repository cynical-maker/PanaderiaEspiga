<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Panadería La Espiga</title>
</head>
<body>

    <header>
        <img src="img/logo.jpg" alt="Logotipo de Panadería La Espiga" width="160" height="60">
        <h1>Contacto</h1>
        <p>Estamos para atenderle</p>

        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="reservas.html">Pedir</a></li>
                <li><a href="carta.html">Cartas
                </a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Escríbanos</h2>
        <form action="#" method="post">
            <p>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required maxlength="60"
                       placeholder="Ej.: María Fernanda Pérez" autocomplete="name">
            </p>

            <p>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required
                       placeholder="usuario@correo.com" autocomplete="email">
            </p>

            <p>
                <label for="celular">Celular</label>
                <input type="tel" id="celular" name="celular" required
                       placeholder="3001234567" autocomplete="tel">
            </p>

            <p>
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" maxlength="80">
            </p>

            <p>
                <textarea id="mensaje" name="mensaje" rows="5" maxlength="500" required
                          placeholder="Cuéntenos en qué podemos ayudarle"></textarea>
            </p>

            <p><button type="submit">Enviar mensaje</button></p>
        </form>

        <h2>Otros medios de contacto</h2>
        <ul>
            <li><a href="mailto:michaelmoralesingles@gmail.com?subject=Consulta">Escríbanos por correo</a></li>
            <li><a href="tel:+3171651365">3171651365</a></li>
            <li><a href="https://wa.me/573171651365?text=Hola,%20deseo%20información">WhatsApp</a></li>
            <li><a href="https://www.invima.gov.co" target="_blank" rel="noopener noreferrer">INVIMA</a></li>
            <li><a href="docs/terminos.pdf" download>Descargar términos y condiciones (PDF)</a></li>
        </ul>
    </main>

    <footer>
        <p><small>&copy; 2026 Panadería La Espiga. Todos los derechos reservados.</small></p>
    </footer>

</body>
</html>
